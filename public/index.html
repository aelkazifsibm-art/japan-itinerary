<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Voyage au Japon - IA Itinerary</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #e63946;
            --bg: #f1faee;
            --card: #ffffff;
            --text: #1d3557;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        button:disabled { opacity: 0.3; }
        .day-card {
            background: var(--card);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .step {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 30px;
            margin-bottom: 20px;
        }
        .step::before {
            content: '';
            position: absolute;
            left: 0;
            top: 5px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
        }
        .travel-info {
            background: #f8f9fa;
            border-left: 3px dashed #cbd5e0;
            margin: 10px 0 20px 5px;
            padding: 10px 15px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🇯🇵 Japon 2026</h1>
        <h2 id="day-title">Chargement...</h2>
    </div>

    <div class="nav-buttons">
        <button id="prevBtn" onclick="changeDay(-1)">← Jour Précédent</button>
        <button id="nextBtn" onclick="changeDay(1)">Jour Suivant →</button>
    </div>

    <div id="itinerary-content" class="day-card">
        </div>
</div>

<script>
    // --- 1. TES DONNÉES (À PERSONNALISER) ---
    const DATA = [
        {
            city: "Tokyo",
            title: "Arrivée & Shibuya",
            steps: [
                { title: "Aéroport de Narita", desc: "Arrivée et récupération du JR Pass" },
                { title: "Statue de Hachiko", desc: "RDV incontournable à Shibuya" },
                { title: "Shibuya Sky", desc: "Vue panoramique sur la ville" }
            ]
        },
        {
            city: "Tokyo",
            title: "Culture & Geek",
            steps: [
                { title: "Temple Senso-ji", desc: "Le plus vieux temple de Tokyo" },
                { title: "Akihabara Electric Town", desc: "Shopping manga et électronique" },
                { title: "Roppongi Hills", desc: "Diner avec vue sur la Tokyo Tower" }
            ]
        }
    ];

    let currentIndex = 0;
    const CACHE_KEY = "japan_travel_cache_v1";

    // --- 2. APPELS API (VIA VERCEL) ---

async function getAiPreciseAddress(lieu, ville) {
  try {
    const prompt = `Donne-moi uniquement le nom du lieu exact au Japon pour Google Maps : "${lieu}" à ${ville}. Pas de phrases, juste le nom.`;
    const response = await fetch(`/api/claude?prompt=${encodeURIComponent(prompt)}`);
    const data = await response.json();
    // On utilise .result car c'est ce qu'on a défini dans l'API au-dessus
    return data.result || lieu;
  } catch (e) {
    return lieu;
  }
}
    async function getDistance(origin, destination) {
        const url = `/api/distance?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`;
        const response = await fetch(url);
        return await response.json();
    }

    // --- 3. MOTEUR DE CALCUL ---

    async function calculTrajetsJour(force = false) {
        const dayData = DATA[currentIndex];
        const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
        
        if (!force && cache[currentIndex]) {
            renderDay(cache[currentIndex].results);
            return;
        }

        renderDay(); // Premier affichage avec squelette

        const results = [];
        const steps = dayData.steps;

        for (let i = 0; i < steps.length - 1; i++) {
            const infoDiv = document.getElementById(`travel-${i}`);
            infoDiv.innerHTML = "✨ L'IA cherche le meilleur trajet...";

            try {
                const dep = await getAiPreciseAddress(steps[i].title, dayData.city);
                const arr = await getAiPreciseAddress(steps[i+1].title, dayData.city);
                
                const distData = await getDistance(`${dep}, Japan`, `${arr}, Japan`);
                const element = distData?.rows?.[0]?.elements?.[0];

                if (element && element.status === "OK") {
                    const mins = Math.round(element.duration.value / 60);
                    results.push({ min: mins, ok: true });
                    infoDiv.innerHTML = `🚇 <strong>${mins} min</strong> via transports publics`;
                } else {
                    throw new Error();
                }
            } catch (e) {
                results.push({ ok: false });
                infoDiv.innerHTML = "⚠️ Trajet à pied ou à vérifier sur place";
            }
            await new Promise(r => setTimeout(r, 500));
        }

        cache[currentIndex] = { results };
        localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    }

    // --- 4. AFFICHAGE ---

    function renderDay(cachedResults = null) {
        const dayData = DATA[currentIndex];
        document.getElementById('day-title').innerText = `Jour ${currentIndex + 1}: ${dayData.title}`;
        
        let html = "";
        dayData.steps.forEach((step, i) => {
            html += `
                <div class="step">
                    <strong>${step.title}</strong>
                    <span>${step.desc}</span>
                </div>
            `;
            if (i < dayData.steps.length - 1) {
                const travelContent = cachedResults ? 
                    `🚇 <strong>${cachedResults[i].min} min</strong> via transports` : 
                    "⏳ Calcul du trajet...";
                html += `<div id="travel-${i}" class="travel-info">${travelContent}</div>`;
            }
        });

        document.getElementById('itinerary-content').innerHTML = html;
        document.getElementById('prevBtn').disabled = (currentIndex === 0);
        document.getElementById('nextBtn').disabled = (currentIndex === DATA.length - 1);
    }

    function changeDay(dir) {
        currentIndex += dir;
        calculTrajetsJour();
    }

    // Lancement au démarrage
    calculTrajetsJour();

</script>
</body>
</html>
