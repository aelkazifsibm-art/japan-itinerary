<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itinéraire Japon — Offline</title>
<style>
:root{
  --bg:#0D1520; --card:#1A2332; --card2:#212D40; --accent:#4B93FF; --accent2:#7DB3FF;
  --text:#FFFFFF; --muted:#D1D9E8; --muted2:#9BA8C0; --border: rgba(255,255,255,.12);
  --shadow: 0 10px 30px rgba(0,0,0,.4); --maxw: 520px; --green: #22c55e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; display:flex; justify-content:center;}
#app{width:100%; max-width:var(--maxw); min-height:100vh; padding:20px 20px 120px;}

/* Header */
header{padding:40px 0 20px; border-bottom:1px solid var(--border); margin-bottom:20px;}
h1{margin:0; font-size:26px; font-weight:900;}
.city-badge{display:inline-block; padding:4px 12px; background:var(--accent); border-radius:100px; font-size:12px; font-weight:800; margin-top:8px;}

/* Cards */
.step-card{background:var(--card); border-radius:20px; padding:18px; margin-bottom:12px; border:1px solid var(--border); box-shadow:var(--shadow);}
.step-time{color:var(--accent2); font-weight:800; font-size:14px; margin-bottom:4px;}
.step-title{font-size:17px; font-weight:800; margin-bottom:6px;}

/* Trajets (Calculated) */
.calculated-travel{
  margin: 10px 0 20px 20px; padding: 12px; border-left: 2px dashed var(--accent);
  background: rgba(75,147,255,0.05); border-radius: 0 12px 12px 0;
}
.travel-box{ font-size: 14px; line-height: 1.5; font-weight: 800; }

/* Popups */
.popup-alert{
  position:fixed; bottom:110px; left:20px; right:20px; background:var(--card2); 
  border:2px solid var(--accent); padding:20px; border-radius:20px; z-index:10000; box-shadow:var(--shadow);
}
.btn-row{display:flex; gap:10px; margin-top:15px;}
.btn{flex:1; padding:12px; border-radius:12px; border:none; font-weight:800; cursor:pointer;}
.btn-p{background:var(--accent); color:white;}
.btn-s{background:var(--card); color:var(--text); border:1px solid var(--border);}

/* Navigation */
nav{
  position:fixed; bottom:0; width:100%; max-width:var(--maxw); background:rgba(26,35,50,0.9);
  backdrop-filter:blur(10px); display:flex; justify-content:space-around; padding:15px 10px 30px;
  border-top:1px solid var(--border);
}
.nav-item{color:var(--muted2); font-size:12px; font-weight:800; cursor:pointer;}
</style>
</head>
<body>

<div id="app">
    <header id="header-ui"></header>
    <div id="main-content"></div>
    <nav>
        <div class="nav-item" onclick="changeDay(-1)">◀ J. Précédent</div>
        <div class="nav-item" onclick="changeDay(1)">J. Suivant ▶</div>
    </nav>
</div>

<script>
// --- DONNÉES ITINÉRAIRE ---
const DATA = [
    { day: "J1", city: "Tokyo", steps: [{time:"09:00", title:"Narita"}, {time:"12:00", title:"Shinjuku"}, {time:"15:00", title:"Shibuya"}] },
    { day: "J2", city: "Tokyo", steps: [{time:"10:00", title:"Asakusa"}, {time:"14:00", title:"Ueno"}] }
];

let currentIndex = 0;
const CACHE_KEY = 'japon_v3_cache';

// --- MOTEUR API (FICHIER 2 DEMANDÉ) ---

async function getDistance(origin, destination) {
  const url = `/api/distance?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&mode=transit`;
  const response = await fetch(url);
  return await response.json();
}

// --- LOGIQUE SÉQUENTIELLE & CACHE ---

function getFingerprint(dayData) {
    return dayData.steps.map(s => s.title).join('|');
}

async function calculTrajetsJour(force = false) {
    const dayData = DATA[currentIndex];
    const fingerprint = getFingerprint(dayData);
    
    // Check Cache
    const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    const dayCache = cache[currentIndex];

    if (!force && dayCache) {
        if (dayCache.fingerprint === fingerprint) {
            renderStoredTravels(dayCache.results);
            return;
        } else {
            showRecomputePopup();
            return;
        }
    }

    // Calcul Séquentiel
    const results = [];
    const steps = dayData.steps;

    for (let i = 0; i < steps.length - 1; i++) {
        const targetDiv = document.getElementById(`travel-${i}`);
        targetDiv.innerHTML = "⏳ Calcul en cours...";
        
        try {
        // On crée des adresses ultra-précises pour Google
        const adresseDepart = `${steps[i].title}, ${dayData.city}, Japan`;
        const adresseArrivee = `${steps[i+1].title}, ${dayData.city}, Japan`;

        const data = await getDistance(adresseDepart, adresseArrivee);
        const element = data?.rows?.[0]?.elements?.[0];
            const element = data?.rows?.[0]?.elements?.[0];
            
            if (element && element.status === "OK") {
                const minutes = Math.round(element.duration.value / 60);
                const resObj = { min: minutes, ok: true };
                results.push(resObj);
                targetDiv.innerHTML = formatTravelHTML(minutes);
            } else {
                throw new Error();
            }
        } catch (e) {
            results.push({ ok: false });
            targetDiv.innerHTML = "⚠️ Trajet indisponible";
        }
        await new Promise(r => setTimeout(r, 400)); // Pause visuelle
    }

    // Sauvegarde
    cache[currentIndex] = { fingerprint, results };
    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    showToast("Itinéraire calculé ✅");
}

// --- RENDU UI ---

function renderApp() {
    const day = DATA[currentIndex];
    document.getElementById('header-ui').innerHTML = `<h1>${day.day}</h1><div class="city-badge">${day.city}</div>`;
    
    let html = '';
    day.steps.forEach((s, i) => {
        html += `<div class="step-card"><div class="step-time">${s.time}</div><div class="step-title">${s.title}</div></div>`;
        if (i < day.steps.length - 1) html += `<div id="travel-${i}" class="calculated-travel"></div>`;
    });
    document.getElementById('main-content').innerHTML = html;
    
    setTimeout(() => calculTrajetsJour(), 100);
}

function formatTravelHTML(min) {
    return `<div class="travel-box">🚇 ${min} min (1 corresp.)<br>🚶 5 min marche<br><span style="color:var(--accent2)">⏱️ Arrivée: Calculée</span><br><span style="color:var(--green)">✅</span></div>`;
}

function renderStoredTravels(results) {
    results.forEach((r, i) => {
        const div = document.getElementById(`travel-${i}`);
        if (div) div.innerHTML = r.ok ? formatTravelHTML(r.min) : "⚠️ Indisponible";
    });
}

function showRecomputePopup() {
    if (document.getElementById('pop')) return;
    const pop = document.createElement('div');
    pop.id = 'pop'; pop.className = 'popup-alert';
    pop.innerHTML = `<b>Les activités ont changé.</b><br>Recalculer les trajets ?
        <div class="btn-row">
            <button class="btn btn-p" onclick="confirmRecalc(true)">Oui</button>
            <button class="btn btn-s" onclick="confirmRecalc(false)">Non</button>
        </div>`;
    document.body.appendChild(pop);
}

function confirmRecalc(choice) {
    document.getElementById('pop').remove();
    if (choice) calculTrajetsJour(true);
}

function changeDay(dir) {
    let n = currentIndex + dir;
    if (n >= 0 && n < DATA.length) { currentIndex = n; renderApp(); }
}

function showToast(txt) {
    const t = document.createElement('div');
    t.style = "position:fixed; top:20px; background:var(--card2); padding:12px 20px; border-radius:12px; border:1px solid var(--green); z-index:10001; font-weight:800;";
    t.innerText = txt; document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

renderApp();
</script>
</body>
</html>
