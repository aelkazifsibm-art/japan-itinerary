<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JapanRouteEngine — Planning Intelligent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #ff4757; --blue-nav: #3498db; }
        .bg-primary { background-color: var(--primary); }
        .text-primary { color: var(--primary); }
        .bg-nav { background-color: var(--blue-nav); }
        .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 0.9em; }
        .suggestion-item:hover { background: #f8f9fa; color: var(--primary); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <!-- HEADER -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-primary">JapanRouteEngine</h1>
            <button onclick="openModal()" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-bold shadow-lg">+ ACTIVITÉ</button>
        </div>
    </header>

    <!-- PLANNING -->
    <main class="max-w-md mx-auto p-4 space-y-4" id="planning-list">
        <!-- Les activités et blocs navigation seront injectés ici -->
    </main>

    <!-- MODAL AJOUT ACTIVITÉ -->
    <div id="activity-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-bold">Ajouter une activité</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Heure</label>
                    <input type="time" id="modal-time" class="w-full border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-primary">
                </div>
                
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Titre (Saisie libre)</label>
                    <div class="flex space-x-2">
                        <input type="text" id="modal-title-raw" placeholder="Ex: nara cerf" class="flex-1 border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-primary">
                        <button onclick="normalizeText()" class="bg-gray-100 text-gray-600 px-3 rounded-xl text-xs font-bold hover:bg-gray-200">✨ IA</button>
                    </div>
                </div>

                <div id="ia-suggestions" class="hidden bg-indigo-50 p-3 rounded-xl border border-indigo-100 space-y-2">
                    <div class="text-xs font-bold text-indigo-600">SUGGESTION IA :</div>
                    <div id="ia-title-clean" class="text-sm font-bold"></div>
                    <button onclick="applyIASuggestion()" class="text-xs bg-indigo-600 text-white px-2 py-1 rounded">Appliquer</button>
                </div>

                <div class="relative">
                    <label class="text-xs font-bold text-gray-500 uppercase">Destination (Validation Google)</label>
                    <input type="text" id="modal-dest-search" placeholder="Rechercher le lieu..." class="w-full border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-primary" autocomplete="off">
                    <div id="dest-suggestions" class="absolute w-full bg-white shadow-xl rounded-xl mt-1 hidden z-[110] border"></div>
                    <div id="dest-status" class="text-[10px] mt-1 font-bold"></div>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Description</label>
                    <textarea id="modal-desc" class="w-full border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-primary h-20"></textarea>
                </div>
            </div>

            <div class="flex space-x-3 pt-4">
                <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-xl font-bold">ANNULER</button>
                <button onclick="saveActivity()" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold shadow-lg">ENREGISTRER</button>
            </div>
        </div>
    </div>

    <script>
        let activities = JSON.parse(localStorage.getItem('japan_trip_v4') || '[]');
        let selectedPlace = null;
        let iaSuggestedLocation = "";

        function openModal() {
            document.getElementById('activity-modal').classList.remove('hidden');
            resetModal();
        }

        function closeModal() {
            document.getElementById('activity-modal').classList.add('hidden');
        }

        function resetModal() {
            document.getElementById('modal-time').value = "09:00";
            document.getElementById('modal-title-raw').value = "";
            document.getElementById('modal-dest-search').value = "";
            document.getElementById('modal-desc').value = "";
            document.getElementById('ia-suggestions').classList.add('hidden');
            document.getElementById('dest-status').textContent = "";
            selectedPlace = null;
        }

        // 1️⃣ PHASE IA : NORMALISATION
        async function normalizeText() {
            const text = document.getElementById('modal-title-raw').value;
            if (!text) return;
            
            const btn = event.target;
            btn.textContent = "⏳...";
            
            try {
                const r = await fetch('/api/normalize-text', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text })
                });
                const j = await r.json();
                
                document.getElementById('ia-title-clean').textContent = j.title_clean;
                iaSuggestedLocation = j.suggested_location;
                document.getElementById('ia-suggestions').classList.remove('hidden');
            } catch (e) { alert("Erreur IA"); }
            finally { btn.textContent = "✨ IA"; }
        }

        function applyIASuggestion() {
            document.getElementById('modal-title-raw').value = document.getElementById('ia-title-clean').textContent;
            document.getElementById('modal-dest-search').value = iaSuggestedLocation;
            triggerAutocomplete(iaSuggestedLocation);
            document.getElementById('ia-suggestions').classList.add('hidden');
        }

        // 2️⃣ PHASE VALIDATION GOOGLE
        const destInput = document.getElementById('modal-dest-search');
        const destList = document.getElementById('dest-suggestions');
        let autoTimer = null;

        destInput.addEventListener('input', () => triggerAutocomplete(destInput.value));

        function triggerAutocomplete(q) {
            clearTimeout(autoTimer);
            if (q.length < 2) { destList.classList.add('hidden'); return; }
            
            autoTimer = setTimeout(async () => {
                const r = await fetch(`/api/places/autocomplete?q=${encodeURIComponent(q)}`);
                const j = await r.json();
                destList.innerHTML = '';
                if (j.predictions?.length > 0) {
                    destList.classList.remove('hidden');
                    j.predictions.slice(0, 5).forEach(p => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.textContent = p.description;
                        div.onclick = () => selectPlace(p.place_id);
                        destList.appendChild(div);
                    });
                }
            }, 300);
        }

        async function selectPlace(placeId) {
            const r = await fetch(`/api/places/details?place_id=${placeId}`);
            const j = await r.json();
            if (j.ok) {
                selectedPlace = j.place;
                destInput.value = j.place.name;
                destList.classList.add('hidden');
                document.getElementById('dest-status').innerHTML = `<span class="text-green-600">✅ DESTINATION VALIDÉE : ${j.place.formatted_address}</span>`;
            }
        }

        // 3️⃣ ENREGISTREMENT & PLANNING
        function saveActivity() {
            if (!selectedPlace) return alert("Veuillez valider une destination via les suggestions Google.");
            
            const activity = {
                id: Date.now(),
                time: document.getElementById('modal-time').value,
                title: document.getElementById('modal-title-raw').value,
                description: document.getElementById('modal-desc').value,
                place: selectedPlace
            };

            activities.push(activity);
            activities.sort((a, b) => a.time.localeCompare(b.time));
            localStorage.setItem('japan_trip_v4', JSON.stringify(activities));
            closeModal();
            renderPlanning();
        }

        async function renderPlanning() {
            const list = document.getElementById('planning-list');
            list.innerHTML = '';

            for (let i = 0; i < activities.length; i++) {
                const act = activities[i];
                
                // Carte Activité
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-5 shadow-sm border-l-4 border-primary relative";
                card.innerHTML = `
                    <div class="text-xs font-bold text-gray-400 mb-1">${act.time}</div>
                    <div class="text-lg font-bold text-gray-800">${act.title}</div>
                    <div class="text-sm text-gray-500 mt-1">${act.description}</div>
                    <div class="text-[10px] text-gray-300 mt-2 uppercase font-bold">📍 ${act.place.name}</div>
                    <button onclick="deleteActivity(${act.id})" class="absolute top-4 right-4 text-gray-300 hover:text-red-500">✕</button>
                `;
                list.appendChild(card);

                // Bloc Navigation (si activité suivante)
                if (i < activities.length - 1) {
                    const nextAct = activities[i+1];
                    const navId = `nav-${act.id}-${nextAct.id}`;
                    const navBlock = document.createElement('div');
                    navBlock.id = navId;
                    navBlock.className = "bg-nav text-white rounded-2xl p-4 mx-4 -my-2 relative z-10 shadow-md";
                    navBlock.innerHTML = `<div class="text-xs animate-pulse">⏳ Calcul du trajet...</div>`;
                    list.appendChild(navBlock);
                    
                    calculateNav(act.place, nextAct.place, navId);
                }
            }
        }

        async function calculateNav(from, to, elementId) {
            try {
                const r = await fetch('/api/route', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ from_place: from, to_place: to })
                });
                const j = await r.json();
                const el = document.getElementById(elementId);
                if (j.success) {
                    el.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div class="font-bold text-sm">${j.summary}</div>
                            <div class="text-[10px] bg-white bg-opacity-20 px-2 py-0.5 rounded">✅ VÉRIFIÉ</div>
                        </div>
                        <div class="text-[11px] leading-relaxed opacity-90 whitespace-pre-line">${j.details}</div>
                        <div class="mt-2 pt-2 border-t border-white border-opacity-20 text-[10px] font-bold">
                            ⏱️ ARRIVÉE ESTIMÉE : ${j.arrival}
                        </div>
                    `;
                } else {
                    document.getElementById(elementId).innerHTML = `<div class="text-xs text-red-200">Erreur transport</div>`;
                }
            } catch (e) {
                document.getElementById(elementId).innerHTML = `<div class="text-xs text-red-200">Erreur réseau</div>`;
            }
        }

        function deleteActivity(id) {
            activities = activities.filter(a => a.id !== id);
            localStorage.setItem('japan_trip_v4', JSON.stringify(activities));
            renderPlanning();
        }

        window.onload = renderPlanning;
    </script>
</body>
</html>
