<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Route Engine — Pro</title>
    <style>
        :root { --primary: #ff4757; --dark: #2f3542; --light: #f1f2f6; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--light); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .tabs { width: 100%; background: #fff; display: flex; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .tab { flex: 1; padding: 15px; text-align: center; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; color: #777; }
        .tab.active { border-bottom-color: var(--primary); color: var(--primary); }
        .container { max-width: 500px; width: 90%; margin-top: 20px; padding-bottom: 40px; }
        .card { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-size: 0.8em; color: #888; font-weight: bold; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1em; outline: none; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1em; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .result-box { margin-top: 20px; border-left: 4px solid var(--dark); padding-left: 15px; display: none; animation: fadeIn 0.3s; }
        .result-row { margin-bottom: 10px; font-size: 1.1em; display: flex; align-items: center; gap: 10px; }
        .cache-badge { background: #e1e1e1; font-size: 0.6em; padding: 3px 6px; border-radius: 4px; color: #555; font-weight: bold; }
        #map { width: 100%; height: 200px; border-radius: 12px; margin-top: 15px; display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .history-item { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid #ddd; }
    </style>
</head>
<body>

<div class="tabs">
    <div id="tab-search" class="tab active" onclick="switchTab('search')">RECHERCHE</div>
    <div id="tab-history" class="tab" onclick="switchTab('history')">HISTORIQUE</div>
</div>

<div id="view-search" class="container">
    <div class="card">
        <label>DÉPART</label>
        <input type="text" id="from" placeholder="Ex: Tokyo Station" value="Tokyo Station">

        <label>ARRIVÉE</label>
        <input type="text" id="to" placeholder="Ex: Shinjuku Station">
        
        <label>INTENTION (IA - Optionnel si arrivée remplie)</label>
        <input type="text" id="intent" placeholder="Ex: voir les daims">
        
        <button id="btn-calc" onclick="calculate()">CALCULER L'ITINÉRAIRE</button>
        
        <div id="result-box" class="result-box">
            <div id="res-0" class="result-row"></div>
            <div id="res-1" class="result-row"></div>
            <div id="res-2" class="result-row"></div>
            <div id="map"></div>
        </div>
    </div>
</div>

<div id="view-history" class="container" style="display:none;">
    <div id="history-list"></div>
</div>

<!-- Chargement de l'API Google Maps avec Places Library -->
<script>
    let googleMapsApiKey = "";
    let fromPlaceId = "";
    let toPlaceId = "";

    // On récupère la clé API via une petite route config
    async function loadConfig() {
        const r = await fetch('/api/config');
        const config = await r.json();
        googleMapsApiKey = config.googleKey;
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${googleMapsApiKey}&libraries=places&language=fr&region=JP`;
        script.onload = initAutocomplete;
        document.head.appendChild(script);
    }

    function initAutocomplete() {
        const fromAuto = new google.maps.places.Autocomplete(document.getElementById('from'));
        const toAuto = new google.maps.places.Autocomplete(document.getElementById('to'));

        fromAuto.addListener('place_changed', () => {
            const place = fromAuto.getPlace();
            fromPlaceId = place.place_id || "";
        });

        toAuto.addListener('place_changed', () => {
            const place = toAuto.getPlace();
            toPlaceId = place.place_id || "";
        });

        // Reset Place IDs if user types manually
        document.getElementById('from').addEventListener('input', () => { fromPlaceId = ""; });
        document.getElementById('to').addEventListener('input', () => { toPlaceId = ""; });
    }

    function switchTab(tab) {
        document.getElementById('tab-search').className = 'tab' + (tab==='search'?' active':'');
        document.getElementById('tab-history').className = 'tab' + (tab==='history'?' active':'');
        document.getElementById('view-search').style.display = tab==='search'?'block':'none';
        document.getElementById('view-history').style.display = tab==='history'?'block':'none';
        if(tab==='history') loadHistory();
    }

    async function calculate() {
        const from = document.getElementById('from').value;
        const to = document.getElementById('to').value;
        const intent = document.getElementById('intent').value;
        const btn = document.getElementById('btn-calc');
        const resBox = document.getElementById('result-box');
        
        if(!from || (!to && !intent)) return alert("Veuillez remplir le départ et soit une arrivée, soit une intention.");
        
        const cacheKey = `route_${from}_${to}_${intent}`.toLowerCase().replace(/\s+/g, '_');
        const cached = localStorage.getItem(cacheKey);
        if(cached) {
            showResult(JSON.parse(cached), true);
            return;
        }

        btn.disabled = true;
        btn.innerText = "IA EN TRAIN DE RÉFLÉCHIR...";
        resBox.style.display = 'block';
        document.getElementById('res-0').innerText = "⏳ Recherche du lieu...";
        document.getElementById('res-1').innerText = "";
        document.getElementById('res-2').innerText = "";

        try {
            // 1. Demander à l'IA de trouver le lieu ou utiliser l'arrivée directe
            const resp = await fetch('/api/route', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    from, 
                    to, 
                    intent,
                    fromPlaceId,
                    toPlaceId
                })
            });
            const data = await resp.json();
            
            if(data.lines) {
                localStorage.setItem(cacheKey, JSON.stringify(data.lines));
                showResult(data.lines, false);
            } else {
                const errorMsg = data.error || "Lieu introuvable";
                const details = data.details ? ` (${data.details})` : "";
                document.getElementById('res-0').innerText = `❌ ${errorMsg}${details}`;
                if(data.place) document.getElementById('res-1').innerText = `Cible: ${data.place}`;
            }
        } catch(e) {
            document.getElementById('res-0').innerText = "❌ Erreur de connexion";
        } finally {
            btn.disabled = false;
            btn.innerText = "CALCULER L'ITINÉRAIRE";
        }
    }

    function showResult(lines, isCache) {
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('res-0').innerHTML = lines[0] + (isCache ? ' <span class="cache-badge">CACHÉ</span>' : '');
        document.getElementById('res-1').innerText = lines[1];
        document.getElementById('res-2').innerText = lines[2];
    }

    function loadHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        let found = false;
        for (let i = 0; i < localStorage.length; i++){
            const key = localStorage.key(i);
            if(key.startsWith('route_')) {
                found = true;
                const data = JSON.parse(localStorage.getItem(key));
                const title = key.replace('route_','').replace(/_/g,' ').toUpperCase();
                list.innerHTML += `
                    <div class="history-item">
                        <div style="font-weight:bold; color:var(--primary); margin-bottom:5px;">${title}</div>
                        <div>${data[0]}</div>
                        <div style="font-size:0.9em; color:#666">${data[2]}</div>
                    </div>`;
            }
        }
        if(!found) list.innerHTML = "<div style='text-align:center; color:#999; margin-top:40px;'>Aucun historique pour le moment.</div>";
    }

    window.onload = loadConfig;
</script>
</body>
</html>
