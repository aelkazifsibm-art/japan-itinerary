<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Route Engine — Pro V4</title>
    <style>
        :root { --primary: #ff4757; --dark: #2f3542; --light: #f1f2f6; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--light); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .tabs { width: 100%; background: #fff; display: flex; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .tab { flex: 1; padding: 15px; text-align: center; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; color: #777; }
        .tab.active { border-bottom-color: var(--primary); color: var(--primary); }
        .container { max-width: 500px; width: 90%; margin-top: 20px; padding-bottom: 40px; }
        .card { background: #fff; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 15px; top: 42px; color: var(--primary); }
        label { display: block; margin-bottom: 8px; font-size: 0.85em; color: #555; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 14px 14px 14px 45px; border: 2px solid #f0f0f0; border-radius: 12px; box-sizing: border-box; font-size: 1em; outline: none; transition: all 0.3s ease; background: #f9f9f9; -webkit-appearance: none; }
        input:focus, select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.1); }
        
        /* Suggestions Styles */
        .suggestions-list { position: absolute; width: 100%; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 1000; margin-top: 5px; max-height: 250px; overflow-y: auto; display: none; border: 1px solid #eee; }
        .suggestion-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f5f5f5; font-size: 0.9em; color: #333; }
        .suggestion-item:hover { background: #f8f9fa; color: var(--primary); }
        .status-msg { font-size: 0.75em; margin-top: 5px; font-weight: 600; }
        .status-ok { color: #2ed573; }
        .status-err { color: #ff4757; }

        .mode-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-option { flex: 1; padding: 10px; border: 2px solid #f0f0f0; border-radius: 12px; text-align: center; cursor: pointer; font-weight: bold; transition: 0.3s; background: #f9f9f9; }
        .mode-option.active { border-color: var(--primary); color: var(--primary); background: #fff; }
        button { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1em; transition: 0.2s; margin-bottom: 10px; }
        button:active { transform: scale(0.98); }
        button.secondary { background: #747d8c; }
        .result-box { margin-top: 25px; padding: 20px; background: #f8f9fa; border-radius: 15px; border-left: 5px solid var(--primary); display: none; animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .result-row { margin-bottom: 12px; font-size: 1.1em; font-weight: 600; color: var(--dark); display: flex; align-items: center; gap: 12px; }
        .result-details { font-size: 0.9em; font-weight: normal; color: #666; margin-left: 30px; margin-bottom: 10px; line-height: 1.4; white-space: pre-wrap; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .history-item { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid #ddd; }
        #health-out { font-size: 0.8em; background: #000; color: #0f0; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="tabs">
    <div id="tab-search" class="tab active" onclick="switchTab('search')">RECHERCHE</div>
    <div id="tab-history" class="tab" onclick="switchTab('history')">HISTORIQUE</div>
</div>

<div id="view-search" class="container">
    <div class="card">
        <button class="secondary" onclick="checkHealth()">VÉRIFIER ÉTAT APIS</button>
        <pre id="health-out"></pre>

        <div class="input-group">
            <label>DÉPART</label>
            <i>📍</i>
            <input type="text" id="fromInput" placeholder="D'où partez-vous ?" autocomplete="off">
            <div id="fromSuggestions" class="suggestions-list"></div>
            <div id="fromStatus" class="status-msg"></div>
        </div>

        <div class="input-group">
            <label>ARRIVÉE (DESTINATION)</label>
            <i>🏁</i>
            <input type="text" id="toInput" placeholder="Où allez-vous ?" autocomplete="off">
            <div id="toSuggestions" class="suggestions-list"></div>
            <div id="toStatus" class="status-msg"></div>
        </div>

        <label>MODE DE TRANSPORT</label>
        <div class="mode-selector">
            <div id="mode-best" class="mode-option active" onclick="setMode('best')">⚡ OPTIMAL</div>
            <div id="mode-walk" class="mode-option" onclick="setMode('walk')">🚶 PIED</div>
        </div>
        
        <button id="btn-calc" onclick="calculate()">CALCULER L'ITINÉRAIRE</button>
        
        <div id="result-box" class="result-box">
            <div id="res-main" class="result-row"></div>
            <div id="res-steps" class="result-details"></div>
            <div id="res-footer" class="result-row" style="font-size: 0.9em; color: #666;"></div>
        </div>
    </div>
</div>

<div id="view-history" class="container" style="display:none;">
    <div id="history-list"></div>
</div>

<script>
    let fromPlace = null;
    let toPlace = null;
    let selectedMode = "best";

    function setupAutocomplete(inputId, suggestionsId, statusId, setter) {
        const input = document.getElementById(inputId);
        const list = document.getElementById(suggestionsId);
        const status = document.getElementById(statusId);
        let timer = null;

        input.addEventListener('input', () => {
            clearTimeout(timer);
            const q = input.value.trim();
            if (q.length < 2) { list.style.display = 'none'; return; }

            timer = setTimeout(async () => {
                const r = await fetch(`/api/places/autocomplete?q=${encodeURIComponent(q)}`);
                const j = await r.json();
                list.innerHTML = '';
                if (j.predictions && j.predictions.length > 0) {
                    list.style.display = 'block';
                    j.predictions.slice(0, 6).forEach(p => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.textContent = p.description;
                        div.onclick = async () => {
                            const d = await fetch(`/api/places/details?place_id=${p.place_id}`);
                            const dj = await d.json();
                            if (dj.ok) {
                                setter(dj.place);
                                input.value = dj.place.name;
                                status.textContent = '✅ Validé : ' + dj.place.formatted_address;
                                status.className = 'status-msg status-ok';
                                list.style.display = 'none';
                            }
                        };
                        list.appendChild(div);
                    });
                }
            }, 300);
        });

        // Fermer la liste si on clique ailleurs
        document.addEventListener('click', (e) => {
            if (e.target !== input) list.style.display = 'none';
        });
    }

    setupAutocomplete('fromInput', 'fromSuggestions', 'fromStatus', (p) => fromPlace = p);
    setupAutocomplete('toInput', 'toSuggestions', 'toStatus', (p) => toPlace = p);

    async function checkHealth() {
        const out = document.getElementById('health-out');
        out.style.display = 'block';
        out.innerText = "Vérification...";
        try {
            const r = await fetch('/api/health');
            const j = await r.json();
            out.innerText = JSON.stringify(j, null, 2);
        } catch(e) {
            out.innerText = "Erreur: " + e.message;
        }
    }

    function setMode(mode) {
        selectedMode = mode;
        document.getElementById('mode-best').className = 'mode-option' + (mode==='best'?' active':'');
        document.getElementById('mode-walk').className = 'mode-option' + (mode==='walk'?' active':'');
    }

    function switchTab(tab) {
        document.getElementById('tab-search').className = 'tab' + (tab==='search'?' active':'');
        document.getElementById('tab-history').className = 'tab' + (tab==='history'?' active':'');
        document.getElementById('view-search').style.display = tab==='search'?'block':'none';
        document.getElementById('view-history').style.display = tab==='history'?'block':'none';
        if(tab==='history') loadHistory();
    }

    async function calculate() {
        const btn = document.getElementById('btn-calc');
        const resBox = document.getElementById('result-box');
        
        if(!fromPlace || !toPlace) {
            return alert("Veuillez sélectionner un départ et une arrivée dans les suggestions pour valider les lieux.");
        }
        
        btn.disabled = true;
        btn.innerText = "CALCUL EN COURS...";
        resBox.style.display = 'block';
        document.getElementById('res-main').innerText = "⏳ Recherche...";
        document.getElementById('res-steps').innerText = "";

        try {
            const resp = await fetch('/api/route', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    from_place: fromPlace,
                    to_place: toPlace,
                    mode: selectedMode
                })
            });
            const data = await resp.json();
            
            if(data.success) {
                document.getElementById('res-main').innerHTML = data.summary;
                document.getElementById('res-steps').innerText = data.details;
                document.getElementById('res-footer').innerText = `⏱️ Arrivée: ${data.arrival} ✅`;
                saveToHistory(fromPlace.name, toPlace.name, data);
            } else {
                document.getElementById('res-main').innerText = `❌ ${data.error || "Erreur"}`;
            }
        } catch(e) {
            document.getElementById('res-main').innerText = "❌ Erreur de connexion";
        } finally {
            btn.disabled = false;
            btn.innerText = "CALCULER L'ITINÉRAIRE";
        }
    }

    function saveToHistory(from, to, data) {
        const key = `route_${Date.now()}`;
        const item = { from, to, summary: data.summary, arrival: data.arrival, timestamp: new Date().toLocaleString() };
        localStorage.setItem(key, JSON.stringify(item));
    }

    function loadHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        const keys = Object.keys(localStorage).filter(k => k.startsWith('route_')).sort().reverse();
        if(keys.length === 0) {
            list.innerHTML = "<div style='text-align:center; color:#999; margin-top:40px;'>Aucun historique.</div>";
            return;
        }
        keys.forEach(key => {
            const item = JSON.parse(localStorage.getItem(key));
            list.innerHTML += `
                <div class="history-item">
                    <div style="font-weight:bold; color:var(--primary);">${item.from} ➔ ${item.to}</div>
                    <div>${item.summary}</div>
                    <div style="font-size:0.8em; color:#999;">${item.timestamp}</div>
                </div>`;
        });
    }
</script>
</body>
</html>
