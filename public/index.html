<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japon 2026 - Itinéraire</title>
    <style>
        :root { --primary: #e63946; --bg: #f8fdf9; --card: #ffffff; --text: #1d3557; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; }
        .day-card { background: var(--card); border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .nav-buttons { display: flex; justify-content: space-between; margin-bottom: 20px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:disabled { opacity: 0.3; }
        .step { padding-left: 20px; border-left: 3px solid var(--primary); margin-bottom: 20px; position: relative; }
        .travel-info { background: #f1f3f5; border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 0.9em; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center">🇯🇵 Japon 2026</h1>
    <h2 id="day-title" style="text-align:center; color: var(--primary);">Chargement...</h2>

    <div class="nav-buttons">
        <button id="prevBtn" onclick="changeDay(-1)">← Précédent</button>
        <button id="nextBtn" onclick="changeDay(1)">Suivant →</button>
    </div>

    <div id="itinerary-content" class="day-card"></div>
</div>

<script>
    const DATA = [
        { city: "Tokyo", title: "Arrivée & Shibuya", steps: [{title: "Aéroport de Narita", desc: "Arrivée"}, {title: "Shinjuku Station", desc: "Pose bagages"}, {title: "Shibuya Crossing", desc: "Soirée"}] },
        { city: "Tokyo", title: "Culture", steps: [{title: "Senso-ji", desc: "Temple"}, {title: "Akihabara", desc: "Geek"}, {title: "Tokyo Tower", desc: "Vue"}] }
    ];

    let currentIndex = 0;

    async function getAiAddress(lieu, ville) {
        try {
            const res = await fetch(`/api/claude?prompt=${encodeURIComponent(lieu + " " + ville)}`);
            const data = await res.json();
            return data.result || lieu; // Utilise .result défini dans l'API
        } catch { return lieu; }
    }

    async function calculTrajets() {
        const day = DATA[currentIndex];
        renderInitial(day);

        for (let i = 0; i < day.steps.length - 1; i++) {
            const infoDiv = document.getElementById(`travel-${i}`);
            try {
                const dep = await getAiAddress(day.steps[i].title, day.city);
                const arr = await getAiAddress(day.steps[i+1].title, day.city);
                
                const res = await fetch(`/api/distance?origin=${encodeURIComponent(dep + ", Japan")}&destination=${encodeURIComponent(arr + ", Japan")}`);
                const d = await res.json();
                
                const element = d.rows[0].elements[0];
                if (element.status === "OK") {
                    const mins = Math.round(element.duration.value / 60);
                    infoDiv.innerHTML = `🚇 <strong>${mins} min</strong> via transports publics`;
                } else { throw new Error(); }
            } catch {
                infoDiv.innerHTML = "⚠️ Trajet à vérifier sur Google Maps";
            }
        }
    }

    function renderInitial(day) {
        document.getElementById('day-title').innerText = `Jour ${currentIndex + 1}: ${day.title}`;
        let html = "";
        day.steps.forEach((s, i) => {
            html += `<div class="step"><strong>${s.title}</strong><br><small>${s.desc}</small></div>`;
            if (i < day.steps.length - 1) html += `<div id="travel-${i}" class="travel-info">⏳ Calcul du temps...</div>`;
        });
        document.getElementById('itinerary-content').innerHTML = html;
        document.getElementById('prevBtn').disabled = currentIndex === 0;
        document.getElementById('nextBtn').disabled = currentIndex === DATA.length - 1;
    }

    function changeDay(n) { currentIndex += n; calculTrajets(); }
    calculTrajets();
</script>
</body>
</html>
